name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, which the type checker
      # needs -- the generated client is not committed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build is the real gate: next.config.ts sets no ignoreBuildErrors /
      # ignoreDuringBuilds escape hatch, so a type or lint error fails here too.
      - name: Build
        run: npm run build
        env:
          # Build-time placeholders. No real secrets are needed to compile, but
          # these must be defined or client-side Supabase setup throws.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
